# ============================================================
# Test Profile Configuration - Uses H2 In-Memory Database
# ============================================================
# This profile is activated during unit/integration tests to avoid
# dependency on a running PostgreSQL instance.

# H2 in-memory database - recreated fresh for each test run
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 console enabled for debugging test data (accessible at /h2-console)
spring.h2.console.enabled=true

# JPA settings for tests - create-drop ensures clean state
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT settings for tests - short expiration for testing token expiry scenarios
app.jwt.secret=testSecretKey_RealTimeCollab_VersionHistory_Test_Secure_Key
app.jwt.expiration=3600000

# Disable SpringDoc during tests to avoid context loading issues
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
