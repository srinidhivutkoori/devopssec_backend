server.port=8080

# RDS PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://whiteboard-db.clqgsee66dd3.eu-west-1.rds.amazonaws.com:5432/whiteboard_db
spring.datasource.username=wbadmin
spring.datasource.password=Whiteboard2024!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
