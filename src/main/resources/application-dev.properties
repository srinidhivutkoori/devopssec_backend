# ============================================================
# Dev Profile - H2 In-Memory Database (no PostgreSQL needed)
# ============================================================
server.port=10001

# H2 in-memory database for local development
spring.datasource.url=jdbc:h2:mem:whiteboarddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 console for debugging
spring.h2.console.enabled=true

# JPA settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=whiteboardSecretKey_RealTimeCollab_VersionHistory_2024_Secure
app.jwt.expiration=86400000

# Logging
logging.level.com.whiteboard=DEBUG
logging.level.org.springframework.security=INFO

# SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# WebSocket
spring.websocket.allowed-origins=*
