# ============================================================
# Application Configuration - Real-Time Collaborative Whiteboard
# ============================================================

# Server configuration
server.port=10001

# ============================================================
# PostgreSQL Database Configuration
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/whiteboard_db
spring.datasource.username=default
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
# ddl-auto=update creates/updates schema automatically based on entity changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# JWT Configuration
# ============================================================
# Secret key must be at least 256 bits (32 chars) for HS256 algorithm
app.jwt.secret=whiteboardSecretKey_RealTimeCollab_VersionHistory_2024_Secure
# Token expiration: 24 hours in milliseconds
app.jwt.expiration=86400000

# ============================================================
# Logging Configuration
# ============================================================
logging.level.com.whiteboard=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============================================================
# SpringDoc OpenAPI / Swagger UI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================================
# WebSocket Configuration
# ============================================================
# Allow all origins for WebSocket connections during development
spring.websocket.allowed-origins=*
